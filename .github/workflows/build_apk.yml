name: Build Android APK with Auto Icon

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate App Icon PNG
        run: |
          pip install pillow
          python generate_icon.py

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Missing Android Platform Files
        run: flutter create . --platforms=android --org=com.example

      - name: Install Dependencies & Setup Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
